<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let saved;
        try {
          saved = localStorage.getItem("told-theme");
        } catch {}
        const theme =
          saved === "light" || saved === "dark"
            ? saved
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f4" />
    <meta
      name="description"
      content="Five stories for your day. A podcast for your curiosity. Meet told., a personal audio experience with room for your questions."
    />
    <meta property="og:title" content="told. — Follow your curiosity." />
    <meta
      property="og:description"
      content="Your world, worth listening to. Personal podcasts and daily news with room for questions."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/daily.jpg" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>told. — Follow your curiosity.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
